name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine track
        id: track
        run: |
          if [[ "${{ github.ref_name }}" == *beta* || "${{ github.ref_name }}" == *alpha* || "${{ github.ref_name }}" == *rc* ]]; then
            echo "build_type=beta" >> "$GITHUB_OUTPUT"
            echo "gradle_suffix=Beta" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "gradle_suffix=Release" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew test${{ steps.track.outputs.gradle_suffix }}UnitTest

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assemble${{ steps.track.outputs.gradle_suffix }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/${{ steps.track.outputs.build_type }}/RehearsAll-*.apk
          generate_release_notes: true
          prerelease: ${{ steps.track.outputs.build_type == 'beta' }}
